<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="glassGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#2E1254" />
      <stop offset="55%" stop-color="#140D2B" />
      <stop offset="100%" stop-color="#0A0618" />
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D968FA" />
      <stop offset="50%" stop-color="#8B32E8" />
      <stop offset="100%" stop-color="#601BD1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark glass circular badge with top rim highlight -->
  <circle cx="50" cy="50" r="46" fill="url(#glassGrad)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2" />
  <circle cx="50" cy="50" r="46" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" opacity="0.8" />

  <!-- Inner glowing cartographic globe -->
  <g filter="url(#glow)" stroke="url(#purpleGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="27" />
    <line x1="23" y1="50" x2="77" y2="50" />
    <ellipse cx="50" cy="50" rx="13.5" ry="27" />
    <line x1="50" y1="23" x2="50" y2="77" />
  </g>

  <!-- Ambient light sparkle -->
  <circle cx="35" cy="33" r="2.5" fill="#FFFFFF" opacity="0.85" />
</svg>
